[package]
name = "olive-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
libcamera = "0.7.0"
log = "0.4"
libc = "0.2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
tower-http = { version = "0.5", features = ["fs", "cors"] }
base64 = "0.22"
clap = { version = "4.4", features = ["derive"] }
image = "0.25"
env_logger = "0.11"
#tetra3 = { git = "https://github.com/oakamil/olive-solve" }
tetra3 = { path = "../olive-solve/tetra3" }
starfield = "0.10.2"
nalgebra = "0.32"
ndarray = "0.17"
rppal = "0.22.1"
rayon = "1.11.0"
uvc = { git = "https://github.com/oakamil/libuvc-rs", features = ["vendor"] }
async-trait = "0.1"
chrono = "0.4"
memchr = "2.7"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
pyo3 = { version = "0.21.2" }

[features]
extension-module = ["pyo3/extension-module"]
default = []

[lib]
name = "olive_engine"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "fat"            # Enables Link-Time Optimization across all dependency crates
codegen-units = 1      # Compiles the whole program as a single unit for max optimization
panic = "abort"        # Removes stack-unwinding overhead
strip = true           # Strips debug symbols to reduce binary size and memory layout
