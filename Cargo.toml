[package]
name = "olive-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
i2c-linux = "0.1.2"
libcamera = "0.7.0"
log = "0.4"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
tower-http = { version = "0.5", features = ["fs", "cors"] }
base64 = "0.22"
clap = { version = "4.4", features = ["derive"] }
image = "0.25"
env_logger = "0.11"
