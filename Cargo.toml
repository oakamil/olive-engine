[package]
name = "olive-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
libc = "0.2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
tower-http = { version = "0.5", features = ["fs", "cors"] }
base64 = "0.22"
image = "0.25"
tetra3 = { path = "../olive-solve/tetra3" }
starfield = "0.10.2"
nalgebra = "0.32"
ndarray = "0.17"
rayon = "1.11.0"
uvc = { git = "https://github.com/oakamil/libuvc-rs", features = ["vendor", "wrap_fd"] }
async-trait = "0.1"
chrono = "0.4"
memchr = "2.7"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
cedar_detect = { git = "https://github.com/oakamil/cedar-detect" }
turbojpeg = "1.4.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
libcamera = "0.7.0"
rppal = "0.22.1"
pyo3 = { version = "0.21.2" }
bno080 = { git = "https://github.com/oakamil/bno080.git", branch = "arvr" }
bmi160 = "1.1.0"
linux-embedded-hal = "0.4.0"
env_logger = "0.11"

[features]
extension-module = ["pyo3/extension-module"]
default = []

[lib]
name = "olive_engine"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "fat"            # Enables Link-Time Optimization across all dependency crates
codegen-units = 1      # Compiles the whole program as a single unit for max optimization
panic = "abort"        # Removes stack-unwinding overhead
strip = true           # Strips debug symbols to reduce binary size and memory layout
